figure:
  id: sfc_mse_throughput_vs_B
  manuscript_figure: 7
  title: "MSE versus B for RbCP_SFC and RbCP_time, and throughput versus B"
  description: >
    Reproduction-oriented experiment for Figure 7:
      - MSE versus B for the proposed RbCP_SFC
      - MSE versus B for its theoretical/operational limit RbCP_time
      - throughput of the proposed RbCP_SFC versus B

    Modeling choices:
      - RbCP_time is interpreted as the error-free time-model boundary:
          signal -> ta/tb -> events -> ta/tb -> signal
      - RbCP_SFC uses the physical SFC channel and semantic-based error detection
      - throughput is defined as the average rate of signals successfully received
        per transmission cycle of tau seconds

# ----------------------------------------------------------------------
# EXPERIMENT MODES
# ----------------------------------------------------------------------
mode:
  run_benchmark: false
  run_rbcp: false
  run_rbcp_time: true
  run_sfc: true

  # Figure 7 relies on semantic-based error detection
  semantic_error_detection: true

# ----------------------------------------------------------------------
# SYSTEM PARAMETERS
# ----------------------------------------------------------------------
system:
  S: 8
  R: 12
  L: 4

  # Figure 7 is assumed here to follow the same physical regime used for Figure 6:
  # fixed P and fixed N0, with SNR varying with B:
  #
  #   SNR(B) = P / (B * N0)
  #
  fixed_power_model: true
  derive_snr_from_fixed_P_and_N0: true

  P: 1.0
  N0: 0.007

  # To be overwritten pointwise by the pipeline
  SNR_dB: null
  B: null

  # If null, total bandwidth is split equally among S sensors.
  bandwidth_allocation: null

# ----------------------------------------------------------------------
# SIGNAL PARAMETERS
# ----------------------------------------------------------------------
signal:
  W: 10.4
  tau: 1.0
  Tt: 0.01

  # Figure-7 style comparison uses fixed N
  N_override: 5

  distribution: "uniform"

  # Absolute-MSE convention adopted in the software side
  peak_to_peak: 2.0

  normalize_dft: true
  normalization_target: 3.9

# ----------------------------------------------------------------------
# DC HANDLING
# ----------------------------------------------------------------------
dc:
  enabled: false

# ----------------------------------------------------------------------
# RbCP_time SETTINGS
# ----------------------------------------------------------------------
rbcp_time:
  enabled: true

  # RbCP_time acts as the theoretical / operational time-model limit:
  #   signal -> ta/tb -> events -> ta/tb -> signal
  use_error_free_time_model: true

# ----------------------------------------------------------------------
# SFC / CHANNEL SETTINGS
# ----------------------------------------------------------------------
channel:
  type: "awgn"
  collision_mode: "sum"

  detection_mode: "threshold"
  threshold_factor: 0.5
  score_threshold: 4

# ----------------------------------------------------------------------
# SEMANTIC-BASED ERROR DETECTION
# ----------------------------------------------------------------------
sed:
  enabled: true

  # Policy used in Figure 7:
  # invalid periods are discarded before reconstruction/throughput accounting
  discard_invalid_periods: true

  # Throughput counting policy:
  #
  # If one period is valid:
  #   all S signals of that cycle are considered successfully received.
  #
  # If one period is invalid:
  #   zero signals are counted as successfully received.
  #
  # Therefore:
  #   throughput = (S * num_valid_periods) / (num_periods * tau)
  #
  throughput_mode: "valid_periods_times_S_over_tau"

# ----------------------------------------------------------------------
# SWEEP PARAMETERS
# ----------------------------------------------------------------------
sweep:
  B:
    start: 500
    stop: 100001
    step: 10000

# ----------------------------------------------------------------------
# MONTE CARLO / AVERAGING
# ----------------------------------------------------------------------
monte_carlo:
  seed: 47
  interactions: 20

# ----------------------------------------------------------------------
# METRICS
# ----------------------------------------------------------------------
metrics:
  mse: true
  throughput: true

  aggregation:
    mean: true

# ----------------------------------------------------------------------
# OUTPUT
# ----------------------------------------------------------------------
output:
  base_dir: "data/results"
  figure_dir: "sfc_mse_throughput_vs_B"

  save_dat: true
  save_plot: true
  save_metadata: true
  save_config_copy: true

  formats:
    plot: ["png", "pdf"]
    data: ["dat"]

# ----------------------------------------------------------------------
# DATA FORMAT
# ----------------------------------------------------------------------
data_format:
  columns:
    - B
    - SNR_dB_derived
    - mse_sfc
    - mse_rbcp_time
    - throughput_sfc
    - throughput_max
    - valid_period_fraction
    - num_trials

  delimiter: "\t"

# ----------------------------------------------------------------------
# PLOT SETTINGS
# ----------------------------------------------------------------------
plot:
  panel_layout: "vertical"

  mse_panel:
    x_axis: "B"
    y_axis: "MSE"
    x_scale: "linear"
    y_scale: "log"
    title: "MSE versus B"
    show_grid: true
    legend: true

  throughput_panel:
    x_axis: "B"
    y_axis: "Throughput"
    x_scale: "linear"
    y_scale: "linear"
    title: "Throughput versus B"
    show_grid: true
    legend: true

  label_map:
    sfc: "RbCP_SFC"
    rbcp_time: "RbCP_time"
    throughput_sfc: "Throughput (RbCP_SFC)"
    throughput_max: "Maximum throughput (S / tau)"

# ----------------------------------------------------------------------
# REPRODUCIBILITY
# ----------------------------------------------------------------------
reproducibility:
  save_git_commit: true
  save_timestamp: true
  seed: 47
