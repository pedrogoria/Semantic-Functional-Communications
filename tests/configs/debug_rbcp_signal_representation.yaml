experiment:
  id: debug_rbcp_signal_representation
  description: >
    Debug configuration for RbCP vs SFC vs Nyquist Benchmark.

# ----------------------------------------------------------------------
# SYSTEM PARAMETERS
# ----------------------------------------------------------------------
system:
  S: 2
  P: 1.0
  B: 5000  # total bandwidth
  R: 12
  L: 4
  SNR_dB: -16.0
  bandwidth_allocation: [0.8, 0.2]

# ----------------------------------------------------------------------
# SIGNAL PARAMETERS
# ----------------------------------------------------------------------
signal:
  W: 10.0
  tau: 1.0
  n_periods: 2
  Tt: 0.01

  distribution: "uniform"

  peak_to_peak: 8.0

  normalize_dft: true
  normalization_target: 3.9

# ----------------------------------------------------------------------
# DC HANDLING
# ----------------------------------------------------------------------
dc:
  enabled: false

# ----------------------------------------------------------------------
# CHANNEL / SFC
# ----------------------------------------------------------------------
channel:
  type: "clean"              # change to "awgn" when needed
  collision_mode: "sum"
  detection_mode: "threshold"
  threshold_factor: 0.5

# ----------------------------------------------------------------------
# BENCHMARK
# ----------------------------------------------------------------------
benchmark:
  enabled: true
  sampling_rate: 12.0

# ----------------------------------------------------------------------
# signals to plots
# ----------------------------------------------------------------------
plot:
  debug_period: 0
  debug_sensor: 0


# ----------------------------------------------------------------------
# REPRODUCIBILITY
# ----------------------------------------------------------------------
reproducibility:
  seed: 12345