[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-functional-communications"
version = "0.1.0"
description = "Semantic-Functional Communications simulations"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy<2.0",
  "scipy<1.11",
  "matplotlib<3.8",
  "pyyaml"
]

[tool.setuptools]
packages = ["sfc"]